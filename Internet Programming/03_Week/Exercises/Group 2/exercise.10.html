<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture 03 - Exercise 10</title>
    <link rel="stylesheet" href="style.css">

    <!-- The quiz engine first, then one line per quiz. To add a quiz, add a
         file to quizzes/ and a line here. All are deferred, so they run in
         this order once the page is parsed. -->
    <script src="exercise.10.js" defer></script>
    <script src="quizzes/course.js" defer></script>
    <script src="quizzes/tricky.js" defer></script>
</head>
<body>
    <h1 id="title">Quiz Time!</h1>

    <section id="menu" class="quiz hidden">
        <p>Choose a quiz:</p>
        <ul id="quiz-list" class="quiz-list"></ul>
        <ul id="quiz-problems" class="quiz-problems"></ul>
    </section>

    <section id="quiz" class="quiz hidden">
        <p id="progress" class="quiz-progress"></p>
        <h2 id="question" class="quiz-question"></h2>
        <div id="options" class="quiz-options"></div>
        <p id="feedback" class="quiz-feedback" aria-live="polite"></p>
        <p id="comment" class="quiz-comment"></p>
        <button id="next-button" type="button" class="hidden">Next</button>
        <p class="quiz-hint">Keyboard: press 1–4 to answer, Enter to continue.</p>
    </section>

    <section id="result" class="quiz hidden">
        <h2>Your score: <span id="score"></span></h2>
        <ul id="wrong-list" class="quiz-wrong"></ul>
        <p class="quiz-actions">
            <button id="restart-button" type="button">Play again</button>
            <a href="exercise.10.html">Choose another quiz</a>
        </p>
    </section>
</body>
</html>
