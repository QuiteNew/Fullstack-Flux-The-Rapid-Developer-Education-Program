<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture 02 - Exercise 02</title>
    <link rel="stylesheet" href="style.css">
    <script src="exercise.02.js" defer></script>
</head>
<body>
    <h1>Registration</h1>

    <form id="register-form" novalidate>
        <div class="form-row">
            <label for="full-name">Full name</label>
            <input id="full-name" name="fullName" type="text" autocomplete="name">
            <span class="error"></span>
        </div>

        <div class="form-row">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email">
            <span class="error"></span>
        </div>

        <div class="form-row">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password">
            <span class="error"></span>
            <div id="strength" class="strength"></div>
        </div>

        <div class="form-row">
            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password">
            <span class="error"></span>
        </div>

        <div class="form-row">
            <label for="age">Age</label>
            <input id="age" name="age" type="number" min="16" max="120">
            <span class="error"></span>
        </div>

        <div class="form-row checkbox-row">
            <label for="terms">I accept the terms and conditions</label>
            <input id="terms" name="terms" type="checkbox">
            <span class="error"></span>
        </div>

        <button id="submit-button" type="submit">Register</button>
    </form>

    <p id="success" class="success hidden"></p>
</body>
</html>
