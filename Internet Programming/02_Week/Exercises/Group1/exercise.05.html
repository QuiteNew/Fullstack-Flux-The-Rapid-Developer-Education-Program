<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture 02 - Exercise 05</title>
    <link rel="stylesheet" href="style.css">
    <script src="exercise.05.js" defer></script>
</head>
<body>
    <h1>Basic Calculator</h1>

    <div class="calculator">
        <div class="calc-display">
            <div id="expression" class="calc-expression"></div>
            <div id="display" class="calc-current">0</div>
        </div>

        <div id="keypad" class="keypad">
            <button data-action="clear">C</button>
            <button data-action="backspace">⌫</button>
            <button data-action="negate">±</button>
            <button data-op="/">÷</button>

            <button data-digit="7">7</button>
            <button data-digit="8">8</button>
            <button data-digit="9">9</button>
            <button data-op="*">×</button>

            <button data-digit="4">4</button>
            <button data-digit="5">5</button>
            <button data-digit="6">6</button>
            <button data-op="-">−</button>

            <button data-digit="1">1</button>
            <button data-digit="2">2</button>
            <button data-digit="3">3</button>
            <button data-op="+">+</button>

            <button data-digit="0" class="wide">0</button>
            <button data-action="decimal">.</button>
            <button data-action="equals">=</button>
        </div>
    </div>

    <h2>History</h2>
    <ul id="history" class="calc-history"></ul>
</body>
</html>
