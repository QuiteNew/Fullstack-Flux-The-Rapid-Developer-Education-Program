<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture 02 - Exercise 03</title>
    <link rel="stylesheet" href="style.css">
    <script src="exercise.03.js" defer></script>
</head>
<body>
    <h1>Image Gallery</h1>

    <p>
        <label for="filter">Filter by title</label>
        <input id="filter" type="search" placeholder="e.g. dawn">
    </p>

    <div id="grid" class="gallery-grid"></div>

    <div id="overlay" class="overlay hidden">
        <button id="close-button" class="overlay-close" aria-label="Close">×</button>
        <button id="prev-button" class="overlay-nav" aria-label="Previous photo">◀</button>
        <figure class="overlay-figure">
            <img id="overlay-image" alt="">
            <figcaption>
                <span id="overlay-caption"></span>
                <span id="overlay-counter" class="overlay-counter"></span>
            </figcaption>
        </figure>
        <button id="next-button" class="overlay-nav" aria-label="Next photo">▶</button>
    </div>
</body>
</html>
