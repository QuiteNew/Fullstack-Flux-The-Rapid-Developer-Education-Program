<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5 — Currency Converter</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../dist/exercise.05/main.js"></script>
</head>
<body>
<main>
    <h1>Currency Converter</h1>
    <p class="hint">Run <code>npx tsc</code> after every change, and refresh.</p>

    <div id="error" class="error" role="alert" hidden><span id="error-text"></span>
        <button id="retry" type="button" class="secondary">Try again</button></div>

    <section class="card">
        <form id="converter">
            <input id="amount" type="number" min="0" step="any" value="100" aria-label="Amount">
            <select id="from" aria-label="From currency"></select>
            <button id="swap" type="button" class="secondary" title="Swap currencies" aria-label="Swap currencies">⇄</button>
            <select id="to" aria-label="To currency"></select>
        </form>
        <p id="result" class="big" aria-live="polite"></p>
        <p id="rate" class="hint"></p>
    </section>

    <p id="updated" class="hint"></p>
    <p class="hint"><a href="https://www.exchangerate-api.com">Rates By Exchange Rate API</a></p>
</main>
</body>
</html>
