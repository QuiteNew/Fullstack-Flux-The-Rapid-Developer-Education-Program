<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 6 — Weather</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../dist/exercise.06/main.js"></script>
</head>
<body>
<main>
    <h1>Weather</h1>
    <p class="hint">Data from <a href="https://open-meteo.com">Open-Meteo</a>.
        Run <code>npx tsc</code> after every change, and refresh.</p>

    <form id="search-form">
        <input id="city" type="search" placeholder="City, e.g. Ohrid" minlength="2" required aria-label="City">
        <button type="submit">Show weather</button>
    </form>
    <p id="status" class="status" aria-live="polite"></p>
    <div id="error" class="error" role="alert" hidden></div>

    <section id="weather" class="card" hidden>
        <h2 id="place"></h2>
        <p id="temperature" class="big"></p>
        <p id="summary"></p>
        <p id="details" class="hint"></p>
        <h3>Next days</h3>
        <ul id="forecast" class="results"></ul>
        <p id="others" class="hint"></p>
    </section>
</main>
</body>
</html>
